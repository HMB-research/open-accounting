info:
  contact: {}
paths:
  /admin/plugin-registries:
    get:
      description: Get all plugin registries (marketplaces)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.Registry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List plugin registries
      tags:
      - Plugins
    post:
      consumes:
      - application/json
      description: Add a new plugin registry (marketplace source)
      parameters:
      - description: Registry details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.CreateRegistryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.Registry'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add plugin registry
      tags:
      - Plugins
  /admin/plugin-registries/{id}:
    delete:
      description: Remove a plugin registry (cannot remove official registries)
      parameters:
      - description: Registry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove plugin registry
      tags:
      - Plugins
  /admin/plugin-registries/{id}/sync:
    post:
      description: Fetch latest plugin list from a registry
      parameters:
      - description: Registry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Sync plugin registry
      tags:
      - Plugins
  /admin/plugins:
    get:
      description: Get all plugins installed on the instance
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.Plugin'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List installed plugins
      tags:
      - Plugins
  /admin/plugins/{id}:
    delete:
      description: Remove an installed plugin (must not be enabled for any tenant)
      parameters:
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Uninstall plugin
      tags:
      - Plugins
    get:
      description: Get details of an installed plugin
      parameters:
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.Plugin'
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get plugin details
      tags:
      - Plugins
  /admin/plugins/{id}/disable:
    post:
      description: Disable a plugin for the entire instance
      parameters:
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable plugin
      tags:
      - Plugins
  /admin/plugins/{id}/enable:
    post:
      consumes:
      - application/json
      description: Enable a plugin for the instance with specified permissions
      parameters:
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      - description: Permissions to grant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.EnablePluginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enable plugin
      tags:
      - Plugins
  /admin/plugins/install:
    post:
      consumes:
      - application/json
      description: Install a plugin from a Git repository
      parameters:
      - description: Repository URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.InstallPluginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_HMB-research_open-accounting_internal_plugin.Plugin'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Install plugin
      tags:
      - Plugins
  /admin/plugins/permissions:
    get:
      description: Get all available plugin permissions with descriptions
      produces:
      - application/json
      responses:
        "200":
          description: OK
